name: macOS test build (app + tools)

# A one-click Mac build for testing a branch: the app from THIS branch plus the
# Cave Survey tools in its cave-survey/ folder, assembled the way assemble.yml
# does, but published nowhere.
# Started by hand only (Actions > macOS test build > Run workflow, or ask Claude to start it).
# Download the "cavecad-macos-test" artifact from the finished run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  # staged on Linux, the same as assemble.yml does (its structural checks need GNU tools)
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage the Cave Survey tools
        run: |
          cd cave-survey
          tools/make_package.sh --stage-only --version "$(cat VERSION)"
          mkdir ../addon && cp -R dist/CaveSurveyTools-*/CaveSurvey ../addon/
      - uses: actions/upload-artifact@v7
        with:
          name: addon
          path: addon/

  assemble:
    needs: [app, addon]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cavecad-macos-arm64
          path: app
      - uses: actions/download-artifact@v8
        with:
          name: addon
          path: addon
      - name: Assemble
        run: |
          hdiutil attach -quiet -nobrowse -readonly -mountpoint base app/CaveCAD.dmg
          ditto base/CaveCAD.app CaveCAD.app
          hdiutil detach -quiet base
          ditto addon/CaveSurvey CaveCAD.app/Contents/Resources/scripts/CaveSurvey
          # a test build must never be "updated" to the published build: marked as a development build,
          # the built-in updater stays out (it offers any other app commit, newer or not)
          printf '{"platform": "macos-arm64", "app_commit": "dev"}\n' > CaveCAD.app/Contents/Resources/cavecad-build.json
          codesign --force --deep -s - CaveCAD.app
          codesign --verify --deep --strict CaveCAD.app
          hdiutil create -quiet -volname CaveCAD -srcfolder CaveCAD.app -ov \
            -format UDZO CaveCAD-macos-test.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: cavecad-macos-test
          path: CaveCAD-macos-test.dmg
          if-no-files-found: error
