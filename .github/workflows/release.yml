name: Release

# Push a tag like v0.9.5 to publish a numbered pre-release: the same
# assembly as the rolling "latest" build (current app base + current
# Cave Survey tools), under the tag's name. Tag the cavecad head, after
# its platform builds have finished.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  assemble:
    uses: ./.github/workflows/assemble.yml
    with:
      tag: ${{ github.ref_name }}
