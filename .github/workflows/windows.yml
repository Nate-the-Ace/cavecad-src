name: Windows build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [cavecad]
    paths-ignore:
      - '.github/workflows/linux.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/release.yml'

env:
  QT_VERSION: 6.10.3
  QT_ARCH: win64_msvc2022_64
  QTJSAPI_REV: c82731320fdc7b61dae56d4cf046bac9376bb2b4
  QCADJSAPI_REV: 2b2b0e86328416dc57ca57a035e10d5dfd919db6

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: cmd
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop %QT_VERSION% %QT_ARCH% -m qt5compat qtimageformats -O %GITHUB_WORKSPACE%\Qt

      - name: Install Ninja
        shell: cmd
        run: choco install ninja -y --no-progress

      # A cold build is ~90 min; with a warm cache a packaging-only change
      # rebuilds in minutes.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-msvc
          max-size: 2G

      - name: Fetch JS API sources
        shell: cmd
        working-directory: ${{ github.workspace }}\..
        run: |
          rem qcadjsapi expects the CaveCAD tree as a sibling directory named "cavecad"
          if not exist cavecad mklink /J cavecad "%GITHUB_WORKSPACE%"
          git clone -q https://github.com/qcad/qtjsapi.git qtjsapi
          git -C qtjsapi checkout -q %QTJSAPI_REV%
          git clone -q https://github.com/qcad/qcadjsapi.git qcadjsapi
          git -C qcadjsapi checkout -q %QCADJSAPI_REV%
          git -C qcadjsapi apply --verbose "%GITHUB_WORKSPACE%\tools\qcadjsapi-cavecad.patch"

      - name: Build CaveCAD
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\vcvars.cmd" || exit /b 1
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_QT6=ON -DCMAKE_PREFIX_PATH=%QTDIR% -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if errorlevel 1 exit /b 1
          cmake --build build
          if errorlevel 1 exit /b 1

      - name: Build qtjsapi
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\vcvars.cmd" || exit /b 1
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          cmake -S ..\qtjsapi -B ..\qtjsapi\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QTDIR% -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if errorlevel 1 exit /b 1
          cmake --build ..\qtjsapi\build
          if errorlevel 1 exit /b 1
          rem qcadjsapi links against qtjsapi via the CaveCAD release directory
          copy /Y ..\qtjsapi\build\out\qtjsapi.dll release\ >nul
          copy /Y ..\qtjsapi\build\out\qtjsapi.lib release\ >nul

      - name: Build cavecadjsapi plugin
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\vcvars.cmd" || exit /b 1
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          cmake -S ..\qcadjsapi -B ..\qcadjsapi\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QTDIR% -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if errorlevel 1 exit /b 1
          cmake --build ..\qcadjsapi\build
          if errorlevel 1 exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $qt = "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\msvc2022_64"
          foreach ($d in 'scripts','libraries','patterns','linetypes','fonts','themes','ts','plugins','defaults') {
            if (Test-Path $d) { Copy-Item -Recurse -Force $d release\ }
          }
          # CaveCAD embeds QJSEngine, not Qt Quick, so skip the QML import scan:
          # it pulls in Qt5Compat/GraphicalEffects and demands Qt6ShaderTools.dll.
          $targets = @("release\cavecad.exe")
          $targets += (Get-ChildItem release\*.dll).FullName
          $targets += (Get-ChildItem release\plugins\*.dll -ErrorAction SilentlyContinue).FullName
          # the custom widget plugin; without it autostart aborts before the main window
          $targets += (Get-ChildItem release\plugins\designer\*.dll -ErrorAction SilentlyContinue).FullName
          # windeployqt exits non-zero on DLLs that don't link Qt (opennurbs,
          # spatialindex, ...). Only the executable has to succeed.
          foreach ($t in $targets) {
            & "$qt\bin\windeployqt.exe" --release --no-quick-import --dir release $t
            if ($LASTEXITCODE -ne 0) {
              if ($t -like '*\cavecad.exe') { throw "windeployqt failed for $t" }
              Write-Host "windeployqt skipped $t (not a Qt binary)"
            }
          }
          $global:LASTEXITCODE = 0
          Remove-Item release\*.exp,release\*.lib,release\plugins\*.exp,release\plugins\*.lib -ErrorAction SilentlyContinue

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: cavecad-windows-x64
          path: release/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore
