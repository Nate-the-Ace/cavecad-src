name: Linux AppImage

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [cavecad]
    paths-ignore:
      - '.github/workflows/windows.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/assemble.yml'

permissions:
  contents: write

env:
  QT_VERSION: 6.10.3
  QTJSAPI_REV: c82731320fdc7b61dae56d4cf046bac9376bb2b4
  QCADJSAPI_REV: 2b2b0e86328416dc57ca57a035e10d5dfd919db6

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            qt_host: linux
            qt_arch: linux_gcc_64
          # Native on GitHub's ARM runner (free for public repos). An AppImage
          # is distro-agnostic, not CPU-agnostic: ARM needs its own.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    runs-on: ${{ matrix.runner }}
    # Built inside 22.04 so the AppImage's glibc floor stays at 2.35 no matter
    # which image GitHub's runner points at.
    container: ubuntu:22.04
    env:
      ARCH: ${{ matrix.arch }}
      QT_HOST: ${{ matrix.qt_host }}
      QT_ARCH: ${{ matrix.qt_arch }}

    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates curl file \
            python3 python3-pip python3-venv desktop-file-utils \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxrender1 libsm6 libice6 zlib1g-dev libdbus-1-dev libcups2 libtiff5 libwebp7 libwebpdemux2 libwebpmux3 ccache

      - uses: actions/checkout@v7

      # A cold build is ~90 min; with a warm cache a packaging-only change
      # rebuilds in minutes.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-gcc-${{ matrix.arch }}
          max-size: 2G

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip3 install --quiet aqtinstall
          python3 -m aqt install-qt "$QT_HOST" desktop "$QT_VERSION" "$QT_ARCH" -m qt5compat qtimageformats -O /opt/Qt
          # gcc_64 or gcc_arm64; every later step reads it from here
          echo "QTDIR=$(ls -d /opt/Qt/"$QT_VERSION"/gcc_*)" >> "$GITHUB_ENV"

      - name: Fetch JS API sources
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          # qcadjsapi expects the CaveCAD tree as a sibling directory named "cavecad"
          ln -sfn "$GITHUB_WORKSPACE" cavecad
          git clone -q https://github.com/qcad/qtjsapi.git qtjsapi
          git -C qtjsapi checkout -q "$QTJSAPI_REV"
          git clone -q https://github.com/qcad/qcadjsapi.git qcadjsapi
          git -C qcadjsapi checkout -q "$QCADJSAPI_REV"
          git -C qcadjsapi apply --verbose "$GITHUB_WORKSPACE/tools/qcadjsapi-cavecad.patch"

      - name: Build CaveCAD
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_QT6=ON -DCMAKE_PREFIX_PATH="$QTDIR" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build

      - name: Build qtjsapi
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          cmake -S qtjsapi -B qtjsapi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build qtjsapi/build
          cp qtjsapi/build/out/libqtjsapi.so "$GITHUB_WORKSPACE/release/"

      - name: Build cavecadjsapi plugin
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          cmake -S qcadjsapi -B qcadjsapi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build qcadjsapi/build

      - name: Assemble AppDir
        run: |
          # CaveCAD resolves scripts, fonts and plugins relative to the executable,
          # so the whole runtime tree lives in usr/bin next to cavecad-bin.
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a release/. AppDir/usr/bin/
          cp -a plugins AppDir/usr/bin/
          for d in scripts libraries patterns linetypes fonts themes ts defaults; do
            [ -d "$d" ] && cp -a "$d" AppDir/usr/bin/
          done
          tools/strip-runtime.sh AppDir/usr/bin
          sed 's/^Exec=cavecad /Exec=cavecad-bin /' cavecad.desktop > AppDir/usr/share/applications/org.cavecad.CaveCAD.desktop
          cp scripts/cavecad_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/org.cavecad.CaveCAD.png
          # written OUTSIDE AppDir: linuxdeploy copies --custom-apprun to
          # AppDir/AppRun and fails when that is the file itself
          cat > AppRun.sh <<'SH'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/bin:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$APPDIR/usr/plugins"
          exec "$APPDIR/usr/bin/cavecad-bin" "$@"
          SH
          chmod +x AppRun.sh

      - name: Check Qt plugin dependencies
        run: |
          # List every system library a Qt plugin needs and the container
          # lacks, all at once -- linuxdeploy stops at the first one.
          missing=$(for f in "$QTDIR"/plugins/*/*.so; do
            ldd "$f" 2>/dev/null | awk '/not found/{print $1}'; done | sort -u)
          echo "missing: ${missing:-none}"

      - name: Build AppImage
        run: |
          export QMAKE="$QTDIR/bin/qmake"
          export PATH="$QTDIR/bin:$PATH"
          curl -sSLo linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$ARCH.AppImage"
          curl -sSLo linuxdeploy-plugin-qt "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$ARCH.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # no FUSE inside the container, so the tools must unpack themselves
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="CaveCAD-$ARCH.AppImage"
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/cavecad-bin \
            --desktop-file AppDir/usr/share/applications/org.cavecad.CaveCAD.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/org.cavecad.CaveCAD.png \
            --custom-apprun AppRun.sh \
            $(for p in AppDir/usr/bin/plugins/*.so AppDir/usr/bin/plugins/designer/*.so; do printf -- '--deploy-deps-only %s ' "$p"; done) \
            --plugin qt --output appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: cavecad-linux-${{ matrix.arch }}-appimage
          path: CaveCAD-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # The bare app, kept on the internal "app-base" release. assemble.yml
  # adds the Cave Survey tools to it and publishes the "latest" build, so
  # a tools change never has to recompile anything. A job of its own
  # because the build container has no gh.
  store-base:
    needs: appimage
    # always(): one architecture failing must not stop the other's upload
    if: always() && github.ref == 'refs/heads/cavecad'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/download-artifact@v8
        id: get
        continue-on-error: true
        with:
          name: cavecad-linux-${{ matrix.arch }}-appimage
      - name: Store as the app base
        if: steps.get.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          mv "CaveCAD-$ARCH.AppImage" "base-linux-$ARCH.AppImage"
          echo "$GITHUB_SHA" > "base-linux-$ARCH.commit"
          gh release view app-base -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create app-base -R "$GITHUB_REPOSITORY" --prerelease \
              --title "App base (internal)" \
              --notes "Bare CaveCAD builds the latest build is assembled from. Not for download: get CaveCAD from the latest release." ||
            gh release view app-base -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload app-base "base-linux-$ARCH.AppImage" "base-linux-$ARCH.commit" --clobber -R "$GITHUB_REPOSITORY"
